plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'nibby.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'nibby.Main'
    }
}

// Portable application image with an embedded Java runtime:
//   gradle jpackageImage  ->  build/dist/NibbyNibble
tasks.register('jpackageImage', Exec) {
    dependsOn jar
    def dest = layout.buildDirectory.dir('dist').get().asFile
    doFirst { delete dest }
    def icon = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'packaging/nibby.ico' : 'packaging/nibby.png'
    commandLine 'jpackage', '--type', 'app-image',
            '--name', 'NibbyNibble',
            '--app-version', project.findProperty('appVersion') ?: '1.0.0',
            '--vendor', 'Guillaume Monet',
            '--description', 'Nibby Nibble (Amiga 1993) - native Java version',
            '--icon', icon,
            '--input', jar.destinationDirectory.get().asFile.path,
            '--main-jar', jar.archiveFileName.get(),
            '--main-class', 'nibby.Main',
            '--add-modules', 'java.desktop',
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files --compress=zip-6',
            '--dest', dest.path
}
